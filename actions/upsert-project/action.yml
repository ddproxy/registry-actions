name: 'Upsert Project in Registry'
description: >
  Creates or updates a project metadata record in a project registry repository.
  If the project does not exist it is created; if it already exists, only the
  provided (non-blank) fields are patched — all others are left unchanged.
inputs:
  project_name:
    description: 'The project slug (e.g., my-project). Must be lowercase alphanumeric and hyphens only.'
    required: true
  display_name:
    description: 'Human-readable name. On create, auto-generated from project_name if blank.'
    required: false
    default: ''
  description:
    description: 'Short project description. On create, defaults to project_name if blank.'
    required: false
    default: ''
  repo_github:
    description: 'GitHub repository URL.'
    required: false
    default: ''
  repo_gitea:
    description: 'Gitea repository URL.'
    required: false
    default: ''
  tags:
    description: 'Comma-separated tag list. On update, replaces existing tags when provided.'
    required: false
    default: ''
  license:
    description: 'License identifier (e.g., MIT). Defaults to MIT on create.'
    required: false
    default: ''
  registry_repo:
    description: 'The registry repository name.'
    required: false
    default: 'project-registry'
  registry_owner:
    description: 'The owner/org of the registry repo. Defaults to current repository owner.'
    required: false
  github_token:
    description: 'Token with contents:write access on the registry repository.'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Checkout registry
      uses: actions/checkout@v6
      with:
        repository: ${{ inputs.registry_owner || github.repository_owner }}/${{ inputs.registry_repo }}
        token: ${{ inputs.github_token }}
        path: registry-tmp

    - name: Upsert project metadata
      shell: bash
      run: |
        PROJECT_DIR="registry-tmp/projects"
        PROJECT_FILE="$PROJECT_DIR/${{ inputs.project_name }}.json"
        INDEX_FILE="registry-tmp/index.json"

        if [[ ! "${{ inputs.project_name }}" =~ ^[a-z0-9-]+$ ]]; then
          echo "Error: project_name must be lowercase alphanumeric with hyphens only."
          exit 1
        fi

        mkdir -p "$PROJECT_DIR"

        if [ -f "$PROJECT_FILE" ]; then
          jq \
            --arg display_name "${{ inputs.display_name }}" \
            --arg description "${{ inputs.description }}" \
            --arg repo_github "${{ inputs.repo_github }}" \
            --arg repo_gitea "${{ inputs.repo_gitea }}" \
            --arg tags_raw "${{ inputs.tags }}" \
            --arg license "${{ inputs.license }}" \
            '
              if $display_name != "" then .displayName = $display_name else . end |
              if $description != "" then .description = $description else . end |
              if $repo_github != "" then .repo.github = $repo_github else . end |
              if $repo_gitea != "" then .repo.gitea = $repo_gitea else . end |
              if $tags_raw != "" then .tags = ($tags_raw | split(",") | map(gsub("^\\s+|\\s+$"; ""))) else . end |
              if $license != "" then .license = $license else . end
            ' \
            "$PROJECT_FILE" > "$PROJECT_FILE.tmp" && mv "$PROJECT_FILE.tmp" "$PROJECT_FILE"

          echo "Updated project: ${{ inputs.project_name }}"
        else
          DISPLAY_NAME="${{ inputs.display_name }}"
          if [ -z "$DISPLAY_NAME" ]; then
            DISPLAY_NAME=$(echo "${{ inputs.project_name }}" | \
              sed 's/-/ /g' | awk '{for(i=1;i<=NF;i++) $i=toupper(substr($i,1,1)) tolower(substr($i,2))}1')
          fi

          DESCRIPTION="${{ inputs.description }}"
          [ -z "$DESCRIPTION" ] && DESCRIPTION="${{ inputs.project_name }}"

          LICENSE="${{ inputs.license }}"
          [ -z "$LICENSE" ] && LICENSE="MIT"

          jq -n \
            --arg name "${{ inputs.project_name }}" \
            --arg displayName "$DISPLAY_NAME" \
            --arg description "$DESCRIPTION" \
            --arg tags_raw "${{ inputs.tags }}" \
            --arg repo_github "${{ inputs.repo_github }}" \
            --arg repo_gitea "${{ inputs.repo_gitea }}" \
            --arg license "$LICENSE" \
            '{
              name: $name,
              displayName: $displayName,
              description: $description,
              tags: (if $tags_raw != "" then ($tags_raw | split(",") | map(gsub("^\\s+|\\s+$"; ""))) else ["project"] end),
              repo: {
                github: (if $repo_github != "" then $repo_github else null end),
                gitea: (if $repo_gitea != "" then $repo_gitea else null end)
              },
              latestVersion: "",
              license: $license
            }' > "$PROJECT_FILE"

          if [ ! -f "$INDEX_FILE" ]; then
            echo '{"projects": []}' > "$INDEX_FILE"
          fi
          jq --arg project "${{ inputs.project_name }}" \
            'if .projects | contains([$project]) then . else .projects += [$project] end' \
            "$INDEX_FILE" > "$INDEX_FILE.tmp" && mv "$INDEX_FILE.tmp" "$INDEX_FILE"

          echo "Created project: ${{ inputs.project_name }}"
        fi

    - name: Commit and push changes
      shell: bash
      run: |
        cd registry-tmp
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        git commit -m "Upsert project: ${{ inputs.project_name }}" || echo "No changes to commit"
        git push
