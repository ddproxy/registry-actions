name: 'Trigger Registry Dispatch'
description: 'Triggers a workflow dispatch in a registry repository via gh CLI (JSON stdin).'
inputs:
  workflow_name:
    description: 'The workflow file to trigger (e.g., upsert-version.yml)'
    required: true
  inputs_json:
    description: 'JSON object of workflow inputs (will be wrapped with ref: main)'
    required: true
  registry_repo:
    description: 'Registry repository name'
    required: false
    default: 'project-registry'
  registry_owner:
    description: 'Owner/org of the registry repo (defaults to current repository owner)'
    required: false
  github_token:
    description: 'Token with actions:write access on the registry repository'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Dispatch workflow
      shell: bash
      run: |
        OWNER="${{ inputs.registry_owner }}"
        [ -z "$OWNER" ] && OWNER="${GITHUB_REPOSITORY_OWNER}"
        REPO="${OWNER}/${{ inputs.registry_repo }}"

        jq -n --argjson inputs '${{ inputs.inputs_json }}' \
          '{ref: "main", inputs: $inputs}' \
          | gh workflow run "${{ inputs.workflow_name }}" --repo "$REPO" --json -
      env:
        GH_TOKEN: ${{ inputs.github_token }}
