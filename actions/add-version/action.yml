name: 'Add Version to Registry'
description: 'Adds a new project version record to a project registry repository.'
inputs:
  project_name:
    description: 'The project slug (e.g., my-project)'
    required: true
  version:
    description: 'The version string (e.g., v1.0.0)'
    required: true
  changelog:
    description: 'A comma-separated list of changes'
    required: true
  asset_source:
    description: 'The download URL for the source code'
    required: true
  asset_binary:
    description: 'The download URL for the binary (optional)'
    required: false
  repo_tag_github:
    description: 'The GitHub tag URL for the version'
    required: false
  repo_tag_gitea:
    description: 'The Gitea tag URL for the version'
    required: false
  license:
    description: 'The license for this version'
    required: false
    default: 'MIT'
  registry_repo:
    description: 'The registry repository (defaults to project-registry)'
    required: false
    default: 'project-registry'
  registry_owner:
    description: 'The owner/org of the registry repo (defaults to current)'
    required: false
  github_token:
    description: 'The GitHub token for making changes'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Checkout registry
      uses: actions/checkout@v6
      with:
        repository: ${{ inputs.registry_owner || github.repository_owner }}/${{ inputs.registry_repo }}
        token: ${{ inputs.github_token }}
        path: registry-tmp

    - name: Update version data
      shell: bash
      run: |
        VERSION_DIR="registry-tmp/projects/${{ inputs.project_name }}/versions"
        mkdir -p "$VERSION_DIR"
        
        # Create version metadata using jq
        jq -n \
          --arg version "${{ inputs.version }}" \
          --arg date "$(date -I)" \
          --arg changelog_raw "${{ inputs.changelog }}" \
          --arg asset_source "${{ inputs.asset_source }}" \
          --arg asset_binary "${{ inputs.asset_binary }}" \
          --arg repo_tag_github "${{ inputs.repo_tag_github }}" \
          --arg repo_tag_gitea "${{ inputs.repo_tag_gitea }}" \
          --arg license "${{ inputs.license }}" \
          '{
            version: $version,
            date: $date,
            changelog: ($changelog_raw | split(",") | map(gsub("^\\s+|\\s+$"; ""))),
            assets: {
              source: [$asset_source],
              binary: (if $asset_binary != "" then [$asset_binary] else null end)
            } | with_entries(select(.value != null)),
            repoLinks: {
              githubTag: (if $repo_tag_github != "" then $repo_tag_github else null end),
              giteaTag: (if $repo_tag_gitea != "" then $repo_tag_gitea else null end)
            },
            license: $license
          }' > "$VERSION_DIR/${{ inputs.version }}.json"

    - name: Update project and version index
      shell: bash
      run: |
        # Update versions/index.json
        VERSION_INDEX="registry-tmp/projects/${{ inputs.project_name }}/versions/index.json"
        NEW_VERSION_FILE="registry-tmp/projects/${{ inputs.project_name }}/versions/${{ inputs.version }}.json"
        
        if [ ! -f "$VERSION_INDEX" ]; then
          echo '[]' > "$VERSION_INDEX"
        fi
        
        # Update or append version in index using jq
        jq --argjson new_v "$(cat "$NEW_VERSION_FILE")" \
          'map(if .version == $new_v.version then $new_v else . end) as $updated
           | if ($updated | map(.version) | contains([$new_v.version])) then $updated else $updated + [$new_v] end' \
          "$VERSION_INDEX" > "$VERSION_INDEX.tmp" && mv "$VERSION_INDEX.tmp" "$VERSION_INDEX"
            
        # Update latestVersion in project metadata
        PROJECT_FILE="registry-tmp/projects/${{ inputs.project_name }}.json"
        if [ -f "$PROJECT_FILE" ]; then
          jq --arg version "${{ inputs.version }}" \
            '.latestVersion = $version' \
            "$PROJECT_FILE" > "$PROJECT_FILE.tmp" && mv "$PROJECT_FILE.tmp" "$PROJECT_FILE"
        else
          echo "Warning: Project metadata file $PROJECT_FILE not found."
        fi

    - name: Commit and push changes
      shell: bash
      run: |
        cd registry-tmp
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        git commit -m "Add version ${{ inputs.version }} for project ${{ inputs.project_name }}" || echo "No changes to commit"
        git push
