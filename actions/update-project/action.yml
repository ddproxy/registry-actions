name: 'Update Project in Registry'
description: 'Patches an existing project metadata record in a project registry repository. Only provided fields are updated; omitted fields are left unchanged.'
inputs:
  project_name:
    description: 'The project slug identifying the record to update (e.g., my-project)'
    required: true
  display_name:
    description: 'New human-readable name (leave blank to keep existing)'
    required: false
    default: ''
  description:
    description: 'New project description (leave blank to keep existing)'
    required: false
    default: ''
  repo_github:
    description: 'New GitHub repository URL (leave blank to keep existing)'
    required: false
    default: ''
  repo_gitea:
    description: 'New Gitea repository URL (leave blank to keep existing)'
    required: false
    default: ''
  tags:
    description: 'Replacement comma-separated tag list (leave blank to keep existing)'
    required: false
    default: ''
  license:
    description: 'New license identifier (leave blank to keep existing)'
    required: false
    default: ''
  registry_repo:
    description: 'The registry repository'
    required: false
    default: 'project-registry'
  registry_owner:
    description: 'The owner/org of the registry repo (defaults to current)'
    required: false
  github_token:
    description: 'The GitHub token for making changes'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Checkout registry
      uses: actions/checkout@v6
      with:
        repository: ${{ inputs.registry_owner || github.repository_owner }}/${{ inputs.registry_repo }}
        token: ${{ inputs.github_token }}
        path: registry-tmp

    - name: Patch project metadata
      shell: bash
      run: |
        PROJECT_FILE="registry-tmp/projects/${{ inputs.project_name }}.json"

        if [ ! -f "$PROJECT_FILE" ]; then
          echo "Error: Project file $PROJECT_FILE not found. Use add-project to create it first."
          exit 1
        fi

        jq \
          --arg display_name "${{ inputs.display_name }}" \
          --arg description "${{ inputs.description }}" \
          --arg repo_github "${{ inputs.repo_github }}" \
          --arg repo_gitea "${{ inputs.repo_gitea }}" \
          --arg tags_raw "${{ inputs.tags }}" \
          --arg license "${{ inputs.license }}" \
          '
            if $display_name != "" then .displayName = $display_name else . end |
            if $description != "" then .description = $description else . end |
            if $repo_github != "" then .repo.github = $repo_github else . end |
            if $repo_gitea != "" then .repo.gitea = $repo_gitea else . end |
            if $tags_raw != "" then .tags = ($tags_raw | split(",") | map(gsub("^\\s+|\\s+$"; ""))) else . end |
            if $license != "" then .license = $license else . end
          ' \
          "$PROJECT_FILE" > "$PROJECT_FILE.tmp" && mv "$PROJECT_FILE.tmp" "$PROJECT_FILE"

    - name: Commit and push changes
      shell: bash
      run: |
        cd registry-tmp
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        git commit -m "Update project: ${{ inputs.project_name }}" || echo "No changes to commit"
        git push
